[build-system]
# Backend package metadata for the WasteWise API.
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wastewise-application"
version = "0.1.0"
description = "Backend API for wastewise application"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.139.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]
